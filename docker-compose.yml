version: "3.3"
services:
  huddle_db:
    image: postgres:14.2
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres

  huddle:
    build:
      context: .
      args:
        - DATABASE_URL=postgres://postgres:postgres@huddle_db:5432/db?pgbouncer=true
    restart: always
    depends_on:
      - huddle_db
    ports:
      - 3000:3000
    environment:
      - DATABASE_URL=postgres://postgres:postgres@huddle_db:5432/db
    env_file:
      - .env

volumes:
  db-data:
    driver: local
